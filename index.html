</style><header><div><strong>수업 한 걸음</strong><small>중학교 기술·가정 ② · 2015 개정</small></div></header><main id="app"></main><footer>교과서 · 천재교과서 중학교 기술·가정 ② (이춘식 외)　|　문항은 교과서와 2015 개정 평가기준을 참고해 새로 구성했습니다.<br>학습 기록은 이 브라우저에만 저장됩니다. 공용 기기에서는 다른 사용자가 같은 학년·반·번호를 선택하면 기록을 볼 수 있습니다.</footer><script>
'use strict';
const units=[{"name":"가족의 이해","m":[{"name":"변화하는 가족과 건강 가정","s":[{"id":1,"name":"변화하는 가족","page":"14","ox":"가족 형태가 달라도 구성원은 서로 돌볼 수 있다.","ans":"O","mc":"학급의 가족 소개 활동을 어떻게 바꾸면 좋을까?","right":"소중한 사람과 함께하는 일을 자유롭게 소개한다","options":["소중한 사람과 함께하는 일을 자유롭게 소개한다","모두에게 부모님 두 분의 사진을 요구한다","가족 수가 많은 순서로 발표한다","같이 살지 않는 사람은 소개하지 못하게 한다","가족 형태마다 점수를 다르게 준다"],"essay":"가족 소개 활동에서 학생이 소외되지 않도록 안내문 한 문장을 쓰고 그 이유를 설명해 보자.","model":"“나를 돌보거나 나와 일상을 나누는 사람을 소개해 주세요.” 다양한 가족의 경험을 존중할 수 있다.","why":"가족은 형태가 다양하며 돌봄과 정서적 지지는 여러 형태의 가족에서 이루어진다.","rub":["다양한 가족을 포괄하는 안내문을 썼다.","그 표현이 소외를 줄이는 이유를 설명했다."]},{"id":2,"name":"건강 가정의 실천","page":"20","ox":"건강한 가정에서는 한 사람이 모든 결정을 맡아야 한다.","ans":"X","mc":"집안일 분담을 조정할 때 먼저 할 일은?","right":"각자의 일정과 할 수 있는 일을 함께 살핀다","options":["각자의 일정과 할 수 있는 일을 함께 살핀다","나이가 가장 어린 사람을 제외한다","소득을 기준으로 발언권을 준다","한 번 정한 역할을 고정한다","시간이 가장 많은 한 명에게 전부 맡긴다"],"essay":"가족 한 명에게 설거지가 몰렸다. 실천 방안과 기대 효과를 적어 보자.","model":"일주일 일정을 보며 설거지와 정리를 나눠 맡으면 부담을 줄이고 협력할 수 있다.","why":"건강한 가정에서는 구성원이 의사 결정에 참여하고 역할을 협의한다.","rub":["부담을 조정할 행동을 정했다.","협력이나 부담의 변화를 설명했다."]}]},{"name":"가족 관계와 갈등 관리","s":[{"id":3,"name":"건강한 가족 관계","page":"28","ox":"가족끼리는 상대의 사적인 공간에 들어갈 때 허락을 구할 필요가 없다.","ans":"X","mc":"동생이 혼자 있고 싶다고 할 때 적절한 말은?","right":"필요하면 말해 줘. 들어가기 전에 노크할게.","options":["필요하면 말해 줘. 들어가기 전에 노크할게.","가족끼리 비밀이 어디 있어?","방문을 열어 두면 바로 해결돼.","답할 때까지 계속 물어볼게.","무슨 일인지 친구에게 먼저 물어볼게."],"essay":"가족의 사생활과 관심을 함께 존중하는 행동과 이유를 쓰자.","model":"방에 들어가기 전 허락을 구하고 대화가 필요할 때 알려 달라고 하면 경계를 존중하면서 관심을 표현할 수 있다.","why":"경계를 존중하면 각자가 안전하고 편안하게 관계를 맺을 수 있다.","rub":["사적인 경계를 존중하는 행동을 썼다.","관심과 존중을 함께 보여 주는 이유를 설명했다."]},{"id":4,"name":"가족 갈등과 해결","page":"32","ox":"나 전달법은 상대의 성격을 단정하는 방식이다.","ans":"X","mc":"약속 시간 문제를 나 전달법으로 표현한 말은?","right":"연락 없이 늦으면 걱정돼. 늦을 때는 알려 줘.","options":["연락 없이 늦으면 걱정돼. 늦을 때는 알려 줘.","넌 늘 무책임해.","모두가 네 탓이라고 해.","이번에도 일부러 그랬지?","약속을 어기는 사람은 싫어."],"essay":"공용 공간의 음악 소리로 갈등이 생겼다. 나 전달법으로 요청해 보자.","model":"음악 소리가 크면 책을 읽기 어려워서 답답해. 저녁에는 이어폰을 써 줄래?","why":"나 전달법은 구체적인 상황과 나의 감정, 바라는 행동을 표현한다.","rub":[ const root=document.querySelector('#app'), numerals=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'];let student='',data={},g=-1,m=-1,topic=null,canSave=true;

const btn=(title,act,cls='')=>'<button type="button" class="'+cls+'" data-act="'+act+'">'+title+'</button>';

function save(){try{localStorage.setItem('techhome.v1.'+student,JSON.stringify(data))}catch{canSave=false;if(!document.querySelector('#warning'))root.insertAdjacentHTML('afterbegin','<p class="banner" id="warning">이 브라우저에서 기록을 저장할 수 없습니다. 창을 열어 둔 동안만 유지됩니다.</p>')}}
function person(){return student.split('-').map((v,i)=>v+['학년','반','번'][i]).join(' ')}
function login(){root.innerHTML='<section class="hero"><div class="eyebrow">기술·가정 ②</div><h1>오늘 배운 내용,<br>스스로 점검해요.</h1><p>수업한 소단원을 고르고 세 문제를 풀어 보세요.</p><form id="signin" class="form">'+['학년','반','번호'].map((t,i)=>'<label>'+t+'<select required name="s'+i+'"><option value="">선택</option>'+Array.from({length:[3,7,30][i]},(_,j)=>'<option value="'+(j+1)+'">'+(j+1)+['학년','반','번'][i]+'</option>').join('')+'</select></label>').join('')+'<button class="primary">학습 시작하기 →</button></form></section><section class="box"><b>학습 순서</b><p>대단원 → 중단원 → 소단원 선택 → 문제 풀이 → 해설과 자기점검</p><small class="muted">6개 대단원 · 31개 소단원 · 93문항</small></section>';document.querySelector('#signin').onsubmit=e=>{e.preventDefault();student=[...e.target.querySelectorAll('select')].map(s=>s.value).join('-');try{data=JSON.parse(localStorage.getItem('techhome.v1.'+student)||'{}')||{};}catch{data={};canSave=false}g=m=-1;topic=null;render()}}

function card(tag,name,desc,act){return '<button class="card" data-act="'+act+'"><span class="eyebrow">'+tag+'</span><strong>'+name+'</strong><small>'+desc+'　→</small></button>'}
function render(){let s=crumbs(),cards=[],title='',note='';if(topic){s+=quiz()}else{if(g<0){title='어떤 대단원을 배웠나요?';note='소단원 점검 완료 '+count(units.flatMap(u=>u.m.flatMap(v=>v.s)))+' / 31';cards=units.map((u,i)=>{let a=u.m.flatMap(v=>v.s);return card('대단원 '+numerals[i],u.name,u.m.length+'개 중단원 · '+count(a)+'/'+a.length+' 소단원 완료','g'+i)})}else if(m<0){title=units[g].name;note='수업한 중단원을 선택하세요.';cards=units[g].m.map((v,i)=>card('중단원 '+(i+1),v.name,count(v.s)+'/'+v.s.length+' 소단원 완료','m'+i))}else{let v=units[g].m[m];title=v.name;note='점검할 소단원을 선택하세요.';cards=v.s.map((t,i)=>card('소단원 '+(m+1)+'-'+(i+1),t.name,'교과서 '+t.page+'쪽 · '+(data[t.id]?.done?'점검 완료':data[t.id]?'진행 중':'3문항'),'s'+i))}s+='<div class="hero"><div class="eyebrow">'+(g<0?'나의 학습':m<0?'대단원 '+numerals[g]:'중단원 '+(m+1))+'</div><h1>'+title+'</h1><p>'+note+'</p></div><h2 class="section">'+(g<0?'대단원':m<0?'중단원':'소단원')+' 선택</h2><div class="grid">'+cards.join('')+'</div>'}root.innerHTML=(canSave?'':'<p class="banner" id="warning">브라우저 저장이 제한되어 현재 창에서만 기록됩니다.</p>')+s;window.scrollTo(0,0);const h=root.querySelector('h1');h.tabIndex=-1;h.focus({preventScroll:true})}
function options(t){let a=t.options.slice();let seed=t.id*1597;for(let i=4;i>0;i--){seed=(seed*48271)%2147483647;let j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function quiz(){let t=topic,d=data[t.id]||{},graded=!!d.graded,arr=options(t),correct=[d.ox===t.ans,arr[d.mc]===t.right],score=correct.filter(Boolean).length;
function radios(group,choices,val){return choices.map(([v,label])=>'<label class="choice"><input type="radio" required name="'+group+'" value="'+v+'" '+(String(val)===String(v)?'checked ':'')+(graded?'disabled':'')+'>'+esc(label)+'</label>').join('')}
function feedback(i,txt){return graded?'<div class="feedback '+(correct[i]?'':'review')+'"><b>'+(correct[i]?'정답':'다시 살펴보기')+'</b> · '+txt+'</div>':''}
return '<div class="hero"><div class="eyebrow">교과서 '+t.page+'쪽부터</div><h1>'+t.name+'</h1><p>'+(graded?'선택형 '+score+'/2 정답 · 서술형 '+(d.done?'자기점검 완료':'자기점검 대기'):'세 문제에 답한 뒤 해설을 확인하세요.')+'</p></div><form id="quiz"><section class="box"><span class="type">01　OX 퀴즈</span><fieldset><legend>'+t.ox+'</legend>'+radios('ox',[['O','O · 맞다'],['X','X · 아니다']],d.ox)+'</fieldset>'+feedback(0,t.ans+' — '+t.why)+'</section><section class="box"><span class="type">02　5지선다형</span><fieldset><legend>'+t.mc+'</legend>'+radios('mc',arr.map((a,i)=>[i,'①②③④⑤'[i]+' '+a]),d.mc)+'</fieldset>'+feedback(1,'정답은 ‘'+t.right+'’입니다. '+t.why)+'</section><section class="box"><span class="type">03　서술형</span><fieldset><legend><label for="essay">'+t.essay+'</label></legend></fieldset><textarea id="essay" name="essay" required maxlength="1500" '+(graded?'readonly':'')+' placeholder="자신의 말로 적어 보세요.">'+esc(d.essay||'')+'</textarea>'+(graded?'<div class="feedback"><b>예시 답안</b><p>'+t.model+'</p></div><h2>내 답안 점검</h2><p>내 답안에 담긴 기준을 표시하세요. 다른 표현으로 설명해도 괜찮습니다.</p>'+t.rub.map((r,i)=>'<label class="choice"><input type="checkbox" data-rub="'+i+'" '+(d.rub?.[i]?'checked ':'')+(d.done?'disabled':'')+'>'+r+'</label>').join('')+(d.done?'<p class="feedback" role="status">점검 완료 · 내 답안에 담긴 기준 '+(d.rub||[]).filter(Boolean).length+'/2</p>':''):'')+'</section><div class="actions">'+(!graded?'<button class="primary">답안 제출하고 해설 보기</button>':d.done?btn('다시 풀기','retry','primary'):btn('자기점검 완료','done','primary'))+btn('소단원 목록','middle')+'</div></form>'}
root.addEventListener('input',e=>{if(!topic||!e.target.closest('#quiz'))return;let d=data[topic.id]??={};if(e.target.dataset.rub!==undefined){(d.rub??=[false,false])[Number(e.target.dataset.rub)]=e.target.checked}else if(['ox','mc','essay'].includes(e.target.name)){d[e.target.name]=e.target.value;if(e.target.name==='essay')e.target.setCustomValidity('')}save()});
root.addEventListener('submit',e=>{if(e.target.id!=='quiz')return;e.preventDefault();const v=e.target.elements.essay;if(!v.value.trim()){v.setCustomValidity('답안을 입력해 주세요.');v.reportValidity();return}const d=data[topic.id]??={};Object.assign(d,Object.fromEntries(new FormData(e.target)),{graded:true,rub:[false,false]});save();render()});
root.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;let a=b.dataset.act;if(a==='user'){student='';data={};topic=null;login();return}if(a==='home'){g=m=-1;topic=null}else if(a==='group'){m=-1;topic=null}else if(a==='middle')topic=null;else if(/^g\d+$/.test(a)){g=+a.slice(1);m=-1;topic=null}else if(/^m\d+$/.test(a)){m=+a.slice(1);topic=null}else if(/^s\d+$/.test(a))topic=units[g].m[m].s[+a.slice(1)];else if(a==='done'){data[topic.id].done=true;save()}else if(a==='retry'){if(!confirm('이 소단원의 기존 답안을 지우고 다시 풀까요?'))return;delete data[topic.id];save()}render()});login();
</script></html>
